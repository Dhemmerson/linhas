<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta de Linha</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#f4f4f7;display:flex;align-items:center;justify-content:center;padding:24px;color:#17151d}
.card{width:min(560px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 16px 50px rgba(0,0,0,.1)}
.logo{font-weight:800;color:#6f35c8;font-size:20px;margin-bottom:22px}
.photo{width:100%;aspect-ratio:1.6;object-fit:cover;border-radius:18px;background:#eee;display:block;margin-bottom:22px}
h1{font-size:25px;margin:0 0 22px}.row{padding:14px 0;border-bottom:1px solid #eee}
.label{font-size:12px;color:#777;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.value{font-size:17px;font-weight:600;word-break:break-word}
.status{text-align:center;color:#777}.error{color:#c62828}
</style>
</head>
<body>
<div class="card" id="app"><div class="status">Carregando...</div></div>
<script>
const SUPABASE_URL = "https://kzsfukiozmeooashmqzj.supabase.co";
const SUPABASE_KEY = "sb_publishable_SKZUSM8208FK711EcpU1DA_hdjM6rMt";
const slug = new URLSearchParams(location.search).get("l");

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function load(){
 const app=document.getElementById("app");
 if(!slug){app.innerHTML='<div class="status error">Link inválido.</div>';return}
 try{
  const r=await fetch(`${SUPABASE_URL}/rest/v1/linhas?select=nome,numero,iccid,imagem_path&slug=eq.${encodeURIComponent(slug)}&limit=1`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
  if(!r.ok) throw new Error("Falha na consulta");
  const rows=await r.json();
  if(!rows.length){app.innerHTML='<div class="status error">Linha não encontrada.</div>';return}
  const x=rows[0];
  app.innerHTML=`
   <div class="logo">WICK</div>
   ${x.imagem_path?`<img class="photo" src="${SUPABASE_URL}/storage/v1/object/public/linha-imagens/${encodeURIComponent(x.imagem_path)}" alt="Imagem da linha">`:''}
   <h1>Dados da linha</h1>
   <div class="row"><div class="label">Nome</div><div class="value">${esc(x.nome)}</div></div>
   <div class="row"><div class="label">Número da linha</div><div class="value">${esc(x.numero)}</div></div>
   <div class="row"><div class="label">ICCID</div><div class="value">${esc(x.iccid)}</div></div>`;
 }catch(e){app.innerHTML='<div class="status error">Não foi possível carregar os dados.</div>'}
}
load();
</script>
</body>
</html>
